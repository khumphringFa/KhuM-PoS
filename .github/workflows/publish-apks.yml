name: Publish APKs to Releases
on:
  workflow_run:
    workflows: [Check and build Android, Build signed Android APK]
    types: [completed]
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/publish-apks.yml
      - scripts/publish-apks.cjs
permissions:
  contents: write
  actions: read
concurrency:
  group: publish-android-releases
  cancel-in-progress: false
jobs:
  publish:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      # Always run the trusted default-branch publisher. Downloaded APKs are never executed.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - uses: actions/github-script@v7
        with:
          script: |
            await require('./scripts/publish-apks.cjs')({github, context, core});
